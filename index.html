<!doctype html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Fraunces:opsz,wght@9..144,300;9..144,400&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #091423;
    --navy-light: #13233a;
    --koper: #d18c5d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 16px;
    color: var(--koper);
    background-color: var(--navy);
    background-image:
      radial-gradient(ellipse at 50% 85%, rgba(30, 55, 90, 0.55) 0%, transparent 60%),
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 100% 100%, 48px 48px, 48px 48px;
    font-family: "Archivo", system-ui, sans-serif;
    text-align: center;
  }
  .logo {
    width: 84px;
    height: 84px;
    border: 1px solid rgba(209, 140, 93, 0.55);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 56px;
  }
  .logo svg { width: 40px; height: 40px; color: var(--koper); }
  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 300;
    font-size: clamp(64px, 16vw, 128px);
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .lijn {
    width: 64px;
    height: 1px;
    background: rgba(209, 140, 93, 0.55);
    margin: 48px auto 32px;
  }
  .ondertitel {
    font-weight: 500;
    font-size: clamp(12px, 3.2vw, 16px);
    letter-spacing: 0.32em;
    text-transform: uppercase;
    padding-left: 0.32em;
  }
  footer {
    position: absolute;
    bottom: 24px;
    left: 0;
    right: 0;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: rgba(209, 140, 93, 0.5);
  }
  footer a { color: inherit; text-decoration: none; }
</style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <polygon points="24,3.5 41.75,13.75 41.75,34.25 24,44.5 6.25,34.25 6.25,13.75" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M31.75 16.25 27.6 27.6 16.25 31.75 20.4 20.4 31.75 16.25Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="24" cy="24" r="1.7" fill="currentColor"/>
    </svg>
  </div>
  <h1>Guideon</h1>
  <div class="lijn"></div>
  <p class="ondertitel">NextGen Family Guidance</p>
